<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Импульс — Онлайн-дуэль</title>
<style>
body{font-family:'Segoe UI',monospace;background:#141414;color:#ddd;padding:20px;max-width:1000px;margin:auto}
h1{color:#e74c3c;text-align:center;letter-spacing:2px;margin-bottom:5px}
.subtitle{text-align:center;color:#888;margin-bottom:20px;font-size:13px}
.row{display:flex;gap:15px;flex-wrap:wrap}
.card{flex:1;min-width:280px;background:#222;padding:15px;border-radius:10px;border:2px solid #333;transition:.2s}
.card.active{border-color:#e74c3c;box-shadow:0 0 15px rgba(231,76,60,.4)}
.card.dead{opacity:.4;filter:grayscale(1)}
.card h2{margin:0 0 10px;font-size:18px}
.p1 h2{color:#3498db}.p2 h2{color:#e67e22}
.stat{font-size:13px;color:#aaa;display:flex;justify-content:space-between}
.bar{background:#333;height:16px;border-radius:8px;overflow:hidden;margin:5px 0 10px}
.fill{height:100%;transition:width .4s}
.hp .fill{background:#2ecc71}.hp.low .fill{background:#f39c12}.hp.crit .fill{background:#e74c3c}
.sta .fill{background:#3498db}
button{background:#e74c3c;color:#fff;border:none;padding:9px 14px;border-radius:6px;cursor:pointer;margin:3px 2px;font-size:13px}
button:hover:not(:disabled){background:#c0392b}
button:disabled{background:#444;cursor:not-allowed;opacity:.5}
button.ability{background:#8e44ad}button.ability:hover:not(:disabled){background:#732d91}
button.ultimate{background:#f39c12;color:#000;font-weight:bold}
.log{background:#0a0a0a;padding:12px;border-radius:8px;height:280px;overflow-y:auto;font-size:13px;line-height:1.5;border:1px solid #333}
.log div{margin:3px 0}
.hit{color:#2ecc71}.miss{color:#e67e22}.crit{color:#f1c40f;font-weight:bold}.sys{color:#888;font-style:italic}
.turn-banner{text-align:center;padding:12px;background:#222;border-radius:8px;margin:15px 0;font-size:16px;border:1px solid #333}
.controls{background:#1c1c1c;padding:15px;border-radius:10px;margin-top:15px}
.lobby{background:#1c1c1c;padding:25px;border-radius:10px;text-align:center}
.lobby input{padding:10px;font-size:16px;background:#222;color:#fff;border:1px solid #444;border-radius:6px;text-align:center;letter-spacing:3px;text-transform:uppercase;width:180px}
.lobby button{padding:12px 25px;font-size:15px;margin:10px 5px}
.room-code{font-size:32px;letter-spacing:8px;color:#f1c40f;font-weight:bold;margin:15px 0}
.who{text-align:center;padding:8px;background:#222;border-radius:6px;margin-bottom:10px;font-size:14px;color:#888}
</style>
</head>
<body>
<h1>⚔️ ИМПУЛЬС</h1>
<div class="subtitle">Онлайн-дуэль на двоих</div>

<div class="lobby" id="lobby">
  <h2 style="color:#3498db">Создать игру</h2>
  <button id="btnCreate">🎮 Создать комнату</button>
  <h2 style="color:#e67e22;margin-top:30px">Или присоединиться</h2>
  <input id="joinCode" placeholder="КОД" maxlength="6">
  <button id="btnJoin">🔗 Войти</button>
  <div id="lobbyStatus" style="color:#888;margin-top:20px"></div>
  <div id="roomDisplay" style="display:none">
    <div style="color:#888;margin-top:20px">Код комнаты — передай второму игроку:</div>
    <div class="room-code" id="myCode">------</div>
  </div>
</div>

<div id="game" style="display:none">
  <div class="who" id="whoAmI"></div>
  <div class="row">
    <div class="card p1" id="card1">
      <h2>🛡️ Игрок 1 — Танк</h2>
      <div class="stat"><span>HP</span><span id="p1hp"></span></div>
      <div class="bar hp" id="p1hpbarwrap"><div class="fill" id="p1hpbar"></div></div>
      <div class="stat"><span>STA</span><span id="p1sta"></span></div>
      <div class="bar sta"><div class="fill" id="p1stabar"></div></div>
      <div class="stat"><span>ATK: <b id="p1atk"></b></span><span>DEF: <b id="p1def"></b></span></div>
      <div class="stat" style="margin-top:8px"><span>Статус:</span><span id="p1status">—</span></div>
    </div>
    <div class="card p2" id="card2">
      <h2>🗡️ Игрок 2 — Ассасин</h2>
      <div class="stat"><span>HP</span><span id="p2hp"></span></div>
      <div class="bar hp" id="p2hpbarwrap"><div class="fill" id="p2hpbar"></div></div>
      <div class="stat"><span>STA</span><span id="p2sta"></span></div>
      <div class="bar sta"><div class="fill" id="p2stabar"></div></div>
      <div class="stat"><span>ATK: <b id="p2atk"></b></span><span>DEF: <b id="p2def"></b></span></div>
      <div class="stat" style="margin-top:8px"><span>Статус:</span><span id="p2status">—</span></div>
    </div>
  </div>
  <div class="turn-banner" id="turnBanner">Ожидание...</div>
  <div class="controls" id="controls">
    <div id="buttons1" style="display:none">
      <b style="color:#3498db">Твой ход (Танк):</b><br>
      <button data-act="attack" data-p="1">🗡 Атака (1 STA)</button>
      <button data-act="dodge" data-p="1">💨 Уклонение (2 STA)</button>
      <button data-act="rest" data-p="1">😮‍💨 Передышка (+4 STA)</button>
      <button class="ability" data-act="shield" data-p="1">🛡️ Щит (3 STA)</button>
      <button class="ultimate" data-act="rage" data-p="1">💥 Ярость (5 STA)</button>
    </div>
    <div id="buttons2" style="display:none">
      <b style="color:#e67e22">Твой ход (Ассасин):</b><br>
      <button data-act="attack" data-p="2">🗡 Атака (1 STA)</button>
      <button data-act="dodge" data-p="2">💨 Уклонение (2 STA)</button>
      <button data-act="rest" data-p="2">😮‍💨 Передышка (+4 STA)</button>
      <button class="ability" data-act="shadowstep" data-p="2">🌑 Тень (3 STA)</button>
      <button class="ultimate" data-act="assassinate" data-p="2">💀 Казнь (5 STA)</button>
    </div>
    <div id="buttonsEnd" style="display:none">
      <b style="color:#f1c40f">Бой окончен</b>
      <button onclick="location.reload()">🔄 Новый бой</button>
    </div>
    <div id="waiting" style="color:#888;font-style:italic">Ход противника...</div>
  </div>
  <div class="log" id="log"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzLQWVJRZxmmY67je7sNwwebpjEzSnhvQ",
  authDomain: "fight-983fe.firebaseapp.com",
  databaseURL: "https://fight-983fe-default-rtdb.firebaseio.com",
  projectId: "fight-983fe",
  storageBucket: "fight-983fe.firebasestorage.app",
  messagingSenderId: "944903707458",
  appId: "1:944903707458:web:656067844a394c5cef06db"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let roomCode = null, myPlayerId = null, roomRef = null, currentState = null;

function genCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let r='';
  for(let i=0;i<6;i++) r+=c[Math.floor(Math.random()*c.length)];
  return r;
}

function initialGameState(){
  return {
    phase:'waiting', turn:null, round:1, over:false, log:[],
    players:{
      1:{name:'Танк',hp:30,maxhp:30,sta:12,maxsta:12,atk:5,def:14,baseDef:14,dodging:false,shielded:false,raging:false,ultUsed:false,rageEnds:0,nextAtkBonus:0},
      2:{name:'Ассасин',hp:22,maxhp:22,sta:14,maxsta:14,atk:6,def:12,baseDef:12,dodging:false,shadow:false,ultUsed:false,nextAtkBonus:0}
    },
    joined:{1:false,2:false}
  };
}

document.getElementById('btnCreate').addEventListener('click', async () => {
  roomCode = genCode();
  myPlayerId = 1;
  roomRef = ref(db, 'rooms/' + roomCode);
  const st = initialGameState();
  st.joined[1] = true;
  try {
    await set(roomRef, st);
    document.getElementById('roomDisplay').style.display = 'block';
    document.getElementById('myCode').textContent = roomCode;
    document.getElementById('lobbyStatus').textContent = 'Ожидание второго игрока...';
    listenToRoom();
  } catch(e) {
    document.getElementById('lobbyStatus').textContent = 'Ошибка: ' + e.message;
  }
});

document.getElementById('btnJoin').addEventListener('click', async () => {
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if (code.length !== 6) { document.getElementById('lobbyStatus').textContent = 'Код должен быть 6 символов'; return; }
  roomRef = ref(db, 'rooms/' + code);
  const snap = await get(roomRef);
  if (!snap.exists()) { document.getElementById('lobbyStatus').textContent = 'Комната не найдена'; return; }
  const st = snap.val();
  if (st.joined && st.joined[2]) { document.getElementById('lobbyStatus').textContent = 'Комната уже занята'; return; }
  roomCode = code;
  myPlayerId = 2;
  await update(roomRef, { 'joined/2': true, phase: 'ready' });
  listenToRoom();
});

function listenToRoom(){
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  document.getElementById('whoAmI').textContent = myPlayerId === 1 ? '🛡️ Ты — Игрок 1 (Танк)' : '🗡️ Ты — Игрок 2 (Ассасин)';
  onValue(roomRef, (snap) => {
    const st = snap.val();
    if (!st) return;
    currentState = st;
    renderState(st);
  });
  if (myPlayerId === 1) {
    const unsub = onValue(roomRef, (snap) => {
      const st = snap.val();
      if (st && st.joined && st.joined[1] && st.joined[2] && st.phase === 'ready') {
        startBattleOnline();
        unsub();
      }
    });
  }
}

async function startBattleOnline(){
  const i1 = roll(20) + 3;
  const i2 = roll(20) + 5;
  const first = i1 >= i2 ? 1 : 2;
  await update(roomRef, {
    phase:'battle', turn:first,
    log:[
      {t:`🎲 Инициатива: Игрок 1 = ${i1}, Игрок 2 = ${i2}`, c:'sys'},
      {t:`⚔️ Первым ходит Игрок ${first}`, c:'sys'}
    ]
  });
}

function roll(s=20){ return Math.floor(Math.random()*s)+1; }
function addLog(st,text,cls=''){ st.log=st.log||[]; st.log.push({t:text,c:cls}); if(st.log.length>100) st.log=st.log.slice(-100); }

document.querySelectorAll('[data-act]').forEach(btn => {
  btn.addEventListener('click', () => doAction(btn.dataset.act, parseInt(btn.dataset.p)));
});

async function doAction(action, id){
  if (!currentState || currentState.over || currentState.turn !== id || myPlayerId !== id) return;
  const st = JSON.parse(JSON.stringify(currentState));
  const me = st.players[id];
  const foeId = id === 1 ? 2 : 1;

  if (action === 'attack') {
    if (me.sta < 1) return; me.sta -= 1;
    executeAttack(st, id, foeId, 0, 0, 'атака');
  } else if (action === 'dodge') {
    if (me.sta < 2) return; me.sta -= 2; me.dodging = true;
    addLog(st, `💨 Игрок ${id} готовится уклоняться`, 'miss'); endTurn(st);
  } else if (action === 'rest') {
    me.sta = Math.min(me.maxsta, me.sta + 4);
    addLog(st, `😮‍💨 Игрок ${id} восстанавливает 4 STA`); endTurn(st);
  } else if (action === 'shield') {
    if (me.sta < 3) return; me.sta -= 3; me.shielded = true; me.def = me.baseDef + 4;
    addLog(st, `🛡 Игрок ${id} поднимает щит (+4 DEF)`, 'hit'); endTurn(st);
  } else if (action === 'rage') {
    if (me.sta < 5 || me.ultUsed) return; me.sta -= 5; me.raging = true; me.ultUsed = true; me.rageEnds = st.round + 2;
    addLog(st, `💥 <b>Игрок ${id} впадает в ЯРОСТЬ!</b> +3 к урону`, 'crit'); endTurn(st);
  } else if (action === 'shadowstep') {
    if (me.sta < 3) return; me.sta -= 3; me.shadow = true; me.def = me.baseDef + 5; me.nextAtkBonus = 4;
    addLog(st, `🌑 Игрок ${id} растворяется в тени (+5 DEF, усиленный удар)`, 'hit'); endTurn(st);
  } else if (action === 'assassinate') {
    if (me.sta < 5 || me.ultUsed) return; me.sta -= 5; me.ultUsed = true;
    addLog(st, `💀 <b>Игрок ${id} проводит КАЗНЬ!</b>`, 'crit');
    executeAttack(st, id, foeId, 5, 8, 'казнь');
  }
  await set(roomRef, st);
}

function executeAttack(st,id,foeId,bonus,dmgBonus,label){
  const a = st.players[id], d = st.players[foeId];
  const atkRoll = roll(20) + a.atk + bonus + (a.nextAtkBonus || 0);
  a.nextAtkBonus = 0;
  let dodgeAttempt = '';
  if (d.dodging && d.sta >= 2) {
    const dr = roll(20) + 4; d.sta -= 2; dodgeAttempt = ` (уклон ${dr})`;
    if (dr >= atkRoll) {
      addLog(st, `💨 Игрок ${foeId} уклоняется! [${label}: ${atkRoll}${dodgeAttempt}]`, 'miss');
      d.dodging = false; endTurn(st); return;
    }
    d.dodging = false;
  }
  if (atkRoll < d.def) {
    addLog(st, `🗡 Игрок ${id} — ${label}: ${atkRoll} vs DEF ${d.def} — промах${dodgeAttempt}`, 'miss');
  } else {
    const crit = atkRoll >= d.def + 10;
    let dmg = roll(6) + 2 + dmgBonus + (crit ? roll(6) : 0);
    if (a.raging) dmg += 3;
    d.hp = Math.max(0, d.hp - dmg);
    addLog(st, `🗡 Игрок ${id} — ${label}: ${atkRoll} vs DEF ${d.def} — ${crit ? 'КРИТ!' : 'попадание'}, урон <b>${dmg}</b>${dodgeAttempt}`, crit ? 'crit' : 'hit');
  }
  endTurn(st);
}

function endTurn(st){
  if (st.players[1].hp <= 0 || st.players[2].hp <= 0) {
    st.over = true;
    let w = null;
    if (st.players[1].hp <= 0 && st.players[2].hp <= 0) w = null;
    else if (st.players[1].hp <= 0) w = 2;
    else w = 1;
    addLog(st, w ? `🏆 <b>Игрок ${w} побеждает!</b>` : '⚖️ <b>Ничья!</b>', 'crit');
    return;
  }
  st.turn = st.turn === 1 ? 2 : 1;
  st.players[st.turn].dodging = false;
  if (st.turn === 1) {
    st.round += 1;
    for (let i of [1,2]) {
      const p = st.players[i];
      p.sta = Math.min(p.maxsta, p.sta + 2);
      if (p.shielded) { p.def = p.baseDef; p.shielded = false; }
      if (p.shadow) { p.def = p.baseDef; p.shadow = false; }
      if (p.raging && st.round > p.rageEnds) p.raging = false;
    }
    addLog(st, `--- Раунд ${st.round} ---`, 'sys');
  }
}

function renderState(st){
  for (let i of [1,2]) {
    const p = st.players[i];
    document.getElementById(`p${i}hp`).textContent = `${p.hp}/${p.maxhp}`;
    document.getElementById(`p${i}sta`).textContent = `${p.sta}/${p.maxsta}`;
    document.getElementById(`p${i}atk`).textContent = p.atk + (p.raging ? ' 🔥' : '');
    document.getElementById(`p${i}def`).textContent = p.def + (p.shielded ? ' 🛡' : '') + (p.shadow ? ' 🌑' : '');
    const hpPct = p.hp/p.maxhp*100;
    document.getElementById(`p${i}hpbar`).style.width = hpPct + '%';
    document.getElementById(`p${i}hpbarwrap`).className = 'bar hp' + (hpPct <= 25 ? ' crit' : hpPct <= 50 ? ' low' : '');
    document.getElementById(`p${i}stabar`).style.width = (p.sta/p.maxsta*100) + '%';
    const status = [];
    if (p.dodging) status.push('💨 уклон');
    if (p.shielded) status.push('🛡 щит');
    if (p.raging) status.push('🔥 ярость');
    if (p.shadow) status.push('🌑 тень');
    document.getElementById(`p${i}status`).textContent = status.length ? status.join(', ') : '—';
    const card = document.getElementById(`card${i}`);
    card.classList.toggle('active', st.turn === i && !st.over);
    card.classList.toggle('dead', p.hp <= 0);
  }
  const isMyTurn = !st.over && st.turn === myPlayerId && st.phase === 'battle';
  document.getElementById('buttons1').style.display = (isMyTurn && myPlayerId === 1) ? 'block' : 'none';
  document.getElementById('buttons2').style.display = (isMyTurn && myPlayerId === 2) ? 'block' : 'none';
  document.getElementById('buttonsEnd').style.display = st.over ? 'block' : 'none';
  document.getElementById('waiting').style.display = (!isMyTurn && !st.over && st.phase === 'battle') ? 'block' : 'none';
  if (st.phase === 'waiting') document.getElementById('turnBanner').innerHTML = '⏳ Ожидание второго игрока...';
  else if (st.over) document.getElementById('turnBanner').innerHTML = '🏁 Бой окончен';
  else {
    const who = st.turn === myPlayerId ? '🎯 <b>ТВОЙ ХОД</b>' : `⏳ Ход противника (Игрок ${st.turn})`;
    document.getElementById('turnBanner').innerHTML = `${who} · Раунд ${st.round}`;
  }
  const logEl = document.getElementById('log');
  logEl.innerHTML = (st.log || []).map(l => `<div class="${l.c||''}">${l.t}</div>`).join('');
  logEl.scrollTop = logEl.scrollHeight;
}
</script>
</body>
</html>
